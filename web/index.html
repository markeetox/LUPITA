<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fish habitat map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mansalva&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #0b1626; --card: #0f1b2d; --line: #22344f; --text: #e6edf6; --muted: #8fa3bd;
    --font: "Mansalva", "Segoe Print", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; font-family: var(--font); font-weight: 400; font-synthesis: none; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  #map { position: absolute; inset: 0; }
  .maplibregl-map, .maplibregl-ctrl, .maplibregl-ctrl-attrib { font-family: var(--font); }
  .maplibregl-ctrl-attrib { font-size: 11px; }

  /* top panel: slides down from the top, hides back up, leaving only an arrow tab */
  .topsheet { position: fixed; top: 0; left: 0; right: 0; margin: 0 auto; width: 100%; max-width: 560px; z-index: 15;
    background: rgba(15,27,45,.96); border: 1px solid var(--line); border-top: none; border-radius: 0 0 20px 20px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5); backdrop-filter: blur(8px);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 16px;
    transition: transform .34s cubic-bezier(.2,.8,.2,1); }
  .topsheet.closed { transform: translateY(-100%); box-shadow: none; }
  .topsheet h1 { font-size: 22px; margin: 0 0 8px; }
  .lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .select { width: 100%; font-size: 17px; color: var(--text); background-color: #0b1626; border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 40px 11px 12px; appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%238fa3bd' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; }
  .select:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  .note { margin: 10px 0 0; font-size: 14px; line-height: 1.35; }
  .note div { display: flex; gap: 8px; margin-bottom: 5px; color: var(--muted); }
  .note i { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .note b { color: var(--text); }
  .chips { margin-top: 4px; }
  .chip { display: inline-block; margin: 6px 6px 0 0; font-size: 13px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); }
  .chip.warn { color: #fbbf24; border-color: #5b4a1a; }
  .chip.ok { color: #34d399; border-color: #1c5a47; }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .tab { position: absolute; top: 100%; left: 50%; width: 76px; height: 30px; margin-left: -38px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);
    background: rgba(15,27,45,.96); border: 1px solid var(--line); border-top: none; border-radius: 0 0 16px 16px; }
  .tab svg { transition: transform .3s; }
  .topsheet:not(.closed) .tab svg { transform: rotate(180deg); }
  .topsheet.closed .tab { margin-top: env(safe-area-inset-top, 0px); }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px;
    max-height: 72vh; display: flex; flex-direction: column; z-index: 20;
    background: var(--card); border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0;
    box-shadow: 0 -14px 44px rgba(0,0,0,.55); padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  .sheet.open { transform: translateY(0); visibility: visible; }
  .grab { flex: none; height: 28px; display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab; }
  .grab::before { content: ""; width: 46px; height: 5px; border-radius: 3px; background: #3a4f6e; }
  .sheet-close { position: absolute; top: 6px; right: 8px; z-index: 3; width: 36px; height: 36px; border: 0;
    border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1; }

  .hero { position: relative; height: 132px; display: flex; align-items: flex-end; padding: 12px 16px;
    background: linear-gradient(135deg, var(--c) 0%, #0b1626 125%); }
  .hero .photo { position: absolute; top: 10px; left: 16px; font-size: 12px; padding: 3px 8px; border-radius: 6px;
    background: rgba(0,0,0,.35); color: #dbe7f5; }
  .hero h2 { margin: 0; font-size: 28px; line-height: 1.05; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  .hero small { display: block; opacity: .9; font-size: 14px; margin-top: 3px; }
  .score { position: absolute; right: 16px; bottom: 12px; text-align: center; background: rgba(11,22,38,.8);
    border-radius: 12px; padding: 6px 12px; }
  .score b { display: block; font-size: 24px; }
  .score span { font-size: 12px; color: var(--muted); }
  .banner { font-size: 13px; padding: 7px 16px; line-height: 1.3; }
  .banner.sample { background: #3a2f10; color: #fbbf24; }
  .banner.live { background: #14304f; color: #9fcbff; }

  .sec { padding: 14px 16px; border-top: 1px solid var(--line); }
  .sec h3 { margin: 0 0 9px; font-size: 14px; color: var(--muted); }
  .reason { display: flex; gap: 9px; align-items: flex-start; font-size: 16px; line-height: 1.35; margin-bottom: 10px; }
  .reason:last-child { margin-bottom: 0; }
  .tag { flex: none; margin-top: 2px; font-size: 12px; padding: 1px 7px; border-radius: 6px; }
  .tag.measured { background: #12392f; color: #34d399; }
  .tag.modeled  { background: #14304f; color: #60a5fa; }
  .tag.seasonal { background: #3b2d12; color: #fbbf24; }
  .tag.static   { background: #2a2a3d; color: #b4b4e8; }
  dl { display: grid; grid-template-columns: 112px 1fr; gap: 7px 10px; margin: 0; font-size: 16px; line-height: 1.3; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  a { color: #7cc0ff; }
  .foot { font-size: 14px; color: var(--muted); padding: 12px 16px 18px; border-top: 1px solid var(--line); line-height: 1.4; }
  .buoy-head { padding: 4px 16px 12px; }
  .buoy-head h2 { margin: 0 0 2px; font-size: 24px; }
  .buoy-head small { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>

<section id="topsheet" class="topsheet" aria-label="Fish and map controls">
  <div id="topBody">
    <h1>Fish habitat map</h1>
    <label for="fishSelect" class="lbl">Show fish</label>
    <select id="fishSelect" class="select"><option value="all">All fish</option></select>
    <div id="fishNote" class="note"></div>
    <div class="chips"><span id="status" class="chip">Loading...</span><span id="buoyStatus" class="chip">Buoys: loading...</span></div>
    <p class="hint">Tap a marker or zone to see why a fish may be there. Experimental.</p>
  </div>
  <button id="topTab" class="tab" type="button" aria-expanded="true" aria-label="Hide panel">
    <svg width="18" height="11" viewBox="0 0 18 11" aria-hidden="true"><path d="M2 2l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</section>

<section id="sheet" class="sheet" aria-hidden="true" aria-label="Details">
  <div id="grab" class="grab"></div>
  <button id="sheetClose" class="sheet-close" aria-label="Close details">&times;</button>
  <div id="sheetBody" class="scroll"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ------------------------------------------------------------------
   CONFIG
   The pipeline publishes fish.json and latest.json to the "data" branch.
   Override with ?data=<folder url ending in />  to test another source.
------------------------------------------------------------------- */
const DATA_BASE_DEFAULT = "https://raw.githubusercontent.com/markeetox/here-fishy-fishy/data/";
const DATA_BASE = (new URLSearchParams(location.search).get("data") || DATA_BASE_DEFAULT).replace(/\/?$/, "/");

const BASE_STYLE = "https://tiles.openfreemap.org/styles/liberty";
const FALLBACK_STYLE = {
  version: 8,
  sources: { osm: { type: "raster", tileSize: 256, tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
    attribution: "&copy; OpenStreetMap contributors" } },
  layers: [{ id: "osm", type: "raster", source: "osm" }]
};

/* Sample data (placeholder values) shown only if fish.json cannot be loaded.
   Same shape as the real fish.json. */
const SAMPLE = {
  sample: true,
  species: [
    { id: "mahi-mahi", name: "Mahi-mahi", sci: "Coryphaena hippurus", color: "#34d399", status: "ok", message: "", spots: 1,
      specs: [["Typical size", "Common up to about 50 lb"], ["Diet", "Small fish, crabs, shrimp, flying fish"], ["Behavior", "Offshore, near floating weed lines"]] },
    { id: "yellowtail-snapper", name: "Yellowtail snapper", sci: "Ocyurus chrysurus", color: "#fbbf24", status: "ok", message: "", spots: 1,
      specs: [["Typical size", "8 to 14 in; up to about 34 in"], ["Adult depth", "Mostly 10-70 m near offshore reefs"], ["Spawning", "April through August"]] },
    { id: "snook", name: "Common snook", sci: "Centropomus undecimalis", color: "#60a5fa", status: "ok", message: "", spots: 1,
      specs: [["Typical size", "Up to about 48 in"], ["Where", "Mangroves, inlets, docks, beaches"], ["Cold limit", "Below about 60 F"]] }
  ],
  spots: [
    { id: "m1", species: "mahi-mahi", title: "Temperature break, offshore", score: 0.78, confidence: "Medium", coords: [-79.93, 25.52],
      ring: [[-80.00, 25.42], [-79.84, 25.40], [-79.80, 25.62], [-79.96, 25.66], [-80.00, 25.42]],
      reasons: [["measured", "Water is 27.8 C, inside the 25-29 C range where mahi are most active. (sample)"], ["modeled", "A sharp temperature break runs through this zone. (sample)"]],
      location: [["Water depth", "About 300 m (sample)"], ["Surface temp", "27.8 C (sample)"]] },
    { id: "y1", species: "yellowtail-snapper", title: "Reef ledge, Fowey Rocks area", score: 0.71, confidence: "Medium", coords: [-80.078, 25.585],
      ring: [[-80.12, 25.56], [-80.04, 25.55], [-80.03, 25.63], [-80.11, 25.64], [-80.12, 25.56]],
      reasons: [["static", "This is natural reef, the structure yellowtail hold on. (sample)"], ["static", "Depth of about 18 m is inside the 10-70 m adult range. (sample)"]],
      location: [["Water depth", "About 18 m (sample)"], ["Bottom", "Natural reef (sample)"]] },
    { id: "s1", species: "snook", title: "Inlet and mangrove edge", score: 0.66, confidence: "Low", coords: [-80.125, 25.903],
      ring: [[-80.15, 25.88], [-80.10, 25.88], [-80.10, 25.93], [-80.15, 25.93], [-80.15, 25.88]],
      reasons: [["static", "Mangrove edge and seawalls give snook cover. (sample)"], ["modeled", "The tide is falling. (sample)"]],
      location: [["Water depth", "1-4 m (sample)"], ["Nearest inlet", "Haulover Inlet (sample)"]] }
  ]
};

/* ---------------- state ---------------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: ignore */ } }
};
let FISH = null, BUOYS = null, FILTER = store.get("fhm.fish") || "all";
const SPECIES = {}, SPOTS = {};
function setFish(data) {
  FISH = data;
  for (const k in SPECIES) delete SPECIES[k];
  for (const k in SPOTS) delete SPOTS[k];
  (data.species || []).forEach(s => { SPECIES[s.id] = s; });
  (data.spots || []).forEach(s => { SPOTS[s.id] = s; });
}

/* ---------------- html builders ---------------- */
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const TAG_LABEL = { measured: "Measured", modeled: "Modeled", seasonal: "Seasonal", static: "Mapped" };

function spotHTML(id) {
  const s = SPOTS[id], sp = SPECIES[s.species];
  const banner = FISH.sample
    ? `<div class="banner sample">Sample data: placeholder values, not a real prediction.</div>`
    : `<div class="banner live">Experimental: shows where conditions match published habitat preferences. Not yet checked against catch reports.</div>`;
  return `
    <div class="hero" style="--c:${esc(sp.color)}">
      <span class="photo">Photo coming soon</span>
      <div><h2>${esc(sp.name)}</h2><small>${esc(sp.sci)}</small></div>
      <div class="score"><b>${Math.round(s.score * 100)}%</b><span>${esc(s.confidence)} confidence</span></div>
    </div>
    ${banner}
    <div class="sec"><h3>Why it may be here</h3>
      ${s.reasons.map(r => `<div class="reason"><span class="tag ${esc(r[0])}">${esc(TAG_LABEL[r[0]] || r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}
    </div>
    <div class="sec"><h3>About this spot: ${esc(s.title)}</h3>
      <dl>${s.location.map(x => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>
    </div>
    <div class="sec"><h3>About the fish</h3>
      <dl>${sp.specs.map(x => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>
    </div>
    <div class="foot">Confidence shows how complete today's data was, not verified accuracy.
      Check current size and bag limits before keeping any fish:
      <a href="https://myfwc.com/fishing/saltwater/" target="_blank" rel="noopener">FWC saltwater fishing</a></div>`;
}

function fmt(v, unit, digits) {
  return (v === null || v === undefined) ? "n/a" : (typeof v === "number" ? v.toFixed(digits == null ? 1 : digits) : v) + (unit ? " " + unit : "");
}
function buoyHTML(b) {
  return `
    <div class="buoy-head"><h2>${esc(b.name || b.station)}</h2><small>Station ${esc(b.station)} &middot; ${esc(b.time_utc || "")}</small></div>
    <div class="sec"><h3>Latest readings</h3><dl>
      <dt>Water temp</dt><dd>${esc(fmt(b.water_temp_c, "C"))}</dd>
      <dt>24 h change</dt><dd>${esc(fmt(b.water_temp_change_24h_c, "C"))}</dd>
      <dt>Wind</dt><dd>${esc(fmt(b.wind_kn, "kn"))}${b.wind_dir_deg != null ? " from " + esc(Math.round(b.wind_dir_deg)) + "&deg;" : ""}</dd>
      <dt>Waves</dt><dd>${esc(fmt(b.wave_height_m, "m"))}</dd>
      <dt>Pressure</dt><dd>${esc(fmt(b.pressure_hpa, "hPa"))} (${esc(fmt(b.pressure_change_3h_hpa, "hPa", 1))} over 3 h)</dd>
    </dl></div>`;
}

/* ---------------- bottom sheet ---------------- */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const closeBtn = document.getElementById("sheetClose");
const grab = document.getElementById("grab");

function openSheet(html, lngLat) {
  if (window.innerWidth < 700) setTop(false, false);       // keep the small screen free for the details
  sheetBody.innerHTML = html;
  sheetBody.scrollTop = 0;
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => {
    const h = Math.min(sheet.offsetHeight, window.innerHeight * 0.72);
    map.easeTo({ center: lngLat, padding: { bottom: h }, duration: 450 });
  });
  closeBtn.focus({ preventScroll: true });
}
function closeSheet() {
  if (!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  map.easeTo({ padding: { bottom: 0 }, duration: 350 });
}
closeBtn.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

let dragStart = null;
grab.addEventListener("touchstart", e => { dragStart = e.touches[0].clientY; sheet.style.transition = "none"; }, { passive: true });
grab.addEventListener("touchmove", e => {
  if (dragStart == null) return;
  sheet.style.transform = `translateY(${Math.max(0, e.touches[0].clientY - dragStart)}px)`;
}, { passive: true });
grab.addEventListener("touchend", e => {
  if (dragStart == null) return;
  const dy = e.changedTouches[0].clientY - dragStart;
  dragStart = null;
  sheet.style.transition = ""; sheet.style.transform = "";
  if (dy > 80) closeSheet();
});

/* ---------------- map ---------------- */
const map = new maplibregl.Map({
  container: "map", style: BASE_STYLE, center: [-80.0, 25.72], zoom: 8.7, attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "bottom-right");

let usedFallback = false, handlersBound = false;
map.on("error", () => {
  if (!map.isStyleLoaded() && !usedFallback) { usedFallback = true; map.setStyle(FALLBACK_STYLE); }
});

function spotZone(s) {
  if (s.rings && s.rings.length) return { type: "MultiPolygon", coordinates: s.rings.map(r => [r]) };
  if (s.ring && s.ring.length > 3) return { type: "Polygon", coordinates: [s.ring] };
  return null;
}
function visibleSpots() {
  return Object.values(SPOTS).filter(s => FILTER === "all" || s.species === FILTER);
}
function spotFeatures() {
  const spots = visibleSpots();
  const color = s => (SPECIES[s.species] || {}).color || "#ffffff";
  return {
    points: { type: "FeatureCollection", features: spots.map(s => ({ type: "Feature",
      properties: { spotId: s.id, species: s.species, color: color(s) },
      geometry: { type: "Point", coordinates: s.coords } })) },
    zones: { type: "FeatureCollection", features: spots.filter(s => spotZone(s)).map(s => ({ type: "Feature",
      properties: { spotId: s.id, species: s.species, color: color(s), outline: !s.rings },
      geometry: spotZone(s) })) }
  };
}

function addData() {
  if (map.getSource("spots")) return;
  const f = spotFeatures();
  map.addSource("zones", { type: "geojson", data: f.zones });
  map.addSource("spots", { type: "geojson", data: f.points });
  const col = ["get", "color"];
  map.addLayer({ id: "zones-fill", type: "fill", source: "zones", paint: { "fill-color": col, "fill-opacity": 0.2 } });
  map.addLayer({ id: "zones-line", type: "line", source: "zones", filter: ["==", ["get", "outline"], true], paint: { "line-color": col, "line-width": 2, "line-dasharray": [2, 2] } });
  map.addLayer({ id: "spots-halo", type: "circle", source: "spots", paint: { "circle-radius": 17, "circle-color": col, "circle-opacity": 0.28 } });
  map.addLayer({ id: "spots", type: "circle", source: "spots",
    paint: { "circle-radius": 9, "circle-color": col, "circle-stroke-color": "#ffffff", "circle-stroke-width": 2.5 } });
  addBuoys();
  bindHandlers();
  if (FISH) fitToSpots();
}

function fitToSpots() {
  const pts = visibleSpots().flatMap(s => (s.rings ? s.rings.flat() : (s.ring && s.ring.length > 3 ? s.ring : [s.coords])));
  if (!pts.length) return;
  const b = pts.reduce((bb, p) => bb.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  const top = topSheet.classList.contains("closed") ? 70 : topSheet.offsetHeight + 24;
  map.fitBounds(b, { padding: { top, left: 40, right: 40, bottom: 60 }, maxZoom: 10, duration: 800 });
}

function refreshSpots() {
  if (!map.getSource("spots")) return;          // style not ready yet: addData() will use the data
  const f = spotFeatures();
  map.getSource("zones").setData(f.zones);
  map.getSource("spots").setData(f.points);
  fitToSpots();
}

function addBuoys() {
  if (!BUOYS || map.getSource("buoys")) return;
  const feats = BUOYS.filter(b => b.ok && b.lat != null && b.lon != null).map(b => ({
    type: "Feature", properties: { idx: BUOYS.indexOf(b) }, geometry: { type: "Point", coordinates: [b.lon, b.lat] } }));
  map.addSource("buoys", { type: "geojson", data: { type: "FeatureCollection", features: feats } });
  map.addLayer({ id: "buoys", type: "circle", source: "buoys",
    paint: { "circle-radius": 5, "circle-color": "#0b1626", "circle-stroke-color": "#e6edf6", "circle-stroke-width": 2 } });
}

function bindHandlers() {
  if (handlersBound) return;
  handlersBound = true;
  const tappable = ["spots", "buoys", "zones-fill"];
  tappable.forEach(layer => {
    map.on("mouseenter", layer, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", layer, () => { map.getCanvas().style.cursor = ""; });
  });
  map.on("click", e => {
    const layers = tappable.filter(l => map.getLayer(l));
    const box = [[e.point.x - 12, e.point.y - 12], [e.point.x + 12, e.point.y + 12]];
    const hits = map.queryRenderedFeatures(box, { layers });
    if (!hits.length) { closeSheet(); return; }
    const f = hits[0];
    if (f.layer.id === "buoys") openSheet(buoyHTML(BUOYS[f.properties.idx]), f.geometry.coordinates);
    else if (f.layer.id === "spots") openSheet(spotHTML(f.properties.spotId), f.geometry.coordinates);
    else openSheet(spotHTML(f.properties.spotId), e.lngLat);
  });
}
map.on("style.load", addData);

/* ---------------- panel ---------------- */
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!isFinite(m)) return "";
  return m < 90 ? `${Math.max(m, 1)} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
/* top panel: slide up/down, remembered between visits */
const topSheet = document.getElementById("topsheet"), topTab = document.getElementById("topTab");
const fishSelect = document.getElementById("fishSelect"), fishNote = document.getElementById("fishNote");
function setTop(open, save) {
  topSheet.classList.toggle("closed", !open);
  topTab.setAttribute("aria-expanded", String(open));
  topTab.setAttribute("aria-label", open ? "Hide panel" : "Show panel");
  document.getElementById("topBody").setAttribute("aria-hidden", String(!open));
  if (save !== false) store.set("fhm.panel", open ? "open" : "closed");
}
topTab.addEventListener("click", () => setTop(topSheet.classList.contains("closed")));
let tStart = null;                                           // swipe up on the panel to hide it
topSheet.addEventListener("touchstart", e => { tStart = (e.target.closest && e.target.closest("select")) ? null : e.touches[0].clientY; }, { passive: true });
topSheet.addEventListener("touchend", e => {
  if (tStart == null) return;
  const dy = e.changedTouches[0].clientY - tStart;
  tStart = null;
  if (dy < -50) setTop(false);
});
setTop(store.get("fhm.panel") !== "closed", false);

function speciesLabel(s) {
  if (s.status === "ok") return `${s.spots} area${s.spots === 1 ? "" : "s"}`;
  return s.status === "unavailable" ? "no data yet" : "none today";
}
function renderNote() {
  const list = (FISH.species || []).filter(s => FILTER === "all" || s.id === FILTER);
  fishNote.innerHTML = list.map(s => {
    const note = s.status === "ok" ? `${s.spots} area${s.spots === 1 ? "" : "s"} today` : (s.message || s.status);
    return `<div><i style="background:${esc(s.color)}"></i><span><b>${esc(s.name)}</b>: ${esc(note)}</span></div>`;
  }).join("");
}
fishSelect.addEventListener("change", () => {
  FILTER = fishSelect.value;
  store.set("fhm.fish", FILTER);
  renderNote();
  closeSheet();
  refreshSpots();
});
function renderPanel() {
  const chip = document.getElementById("status");
  if (!FISH) return;
  if (FISH.sample) { chip.textContent = "Sample data (live data not found)"; chip.className = "chip warn"; }
  else if (FISH.error) { chip.textContent = FISH.error; chip.className = "chip warn"; }
  else { chip.textContent = "Live, experimental" + (FISH.generated_utc ? " · " + ago(FISH.generated_utc) : ""); chip.className = "chip ok"; }
  if (FILTER !== "all" && !SPECIES[FILTER]) FILTER = "all";    // saved choice no longer exists
  fishSelect.innerHTML = `<option value="all">All fish</option>` +
    (FISH.species || []).map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(speciesLabel(s))})</option>`).join("");
  fishSelect.value = FILTER;
  renderNote();
}

/* ---------------- load data ---------------- */
async function getJSON(name) {
  const res = await fetch(DATA_BASE + name, { cache: "no-store" });
  if (!res.ok) throw new Error(name + " HTTP " + res.status);
  return res.json();
}
async function load() {
  try { setFish(await getJSON("fish.json")); }
  catch (err) { console.warn("fish.json failed, using sample:", err); setFish(SAMPLE); }
  renderPanel();
  refreshSpots();

  const chip = document.getElementById("buoyStatus");
  try {
    BUOYS = (await getJSON("latest.json")).buoys || [];
    const ok = BUOYS.filter(b => b.ok).length;
    chip.textContent = `Live buoys: ${ok} of ${BUOYS.length}`;
    chip.className = "chip " + (ok ? "ok" : "warn");
    if (map.getSource("spots")) addBuoys();
  } catch (err) {
    chip.textContent = "Buoys: could not load";
    chip.className = "chip warn";
    console.warn("latest.json failed:", err);
  }
}
load();
</script>
