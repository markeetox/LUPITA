name: NOAA Biscayne shoreline service audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noaa-biscayne-shoreline-audit
  cancel-in-progress: false

jobs:
  discover-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install geometry clipping dependency
        run: python -m pip install shapely
      - name: Test NOAA service metadata parser
        run: python -m pytest -q tests/test_noaa_shoreline_services.py
      - name: Extract NOAA MHW and MHHW shoreline comparison geometries
        run: python scripts/audit_noaa_shoreline_services.py --output-dir artifacts/noaa-shoreline
      - name: Persist clipped shoreline comparison geometry on research branch
        if: success() && github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard FETCH_HEAD
          mkdir -p data/spatial/research
          cp artifacts/noaa-shoreline/noaa_composite_shoreline_mhw_biscayne.geojson data/spatial/research/
          cp artifacts/noaa-shoreline/noaa_mhhw_screening_line_biscayne.geojson data/spatial/research/
          cp artifacts/noaa-shoreline/noaa_nsde_shoreline_service_inventory.json data/spatial/research/noaa-shoreline-comparison-audit.json
          cp artifacts/noaa-shoreline/noaa_composite_shoreline_mhw_metadata.json data/spatial/research/
          cp artifacts/noaa-shoreline/noaa_mhhw_screening_line_metadata.json data/spatial/research/
          git add data/spatial/research/noaa_composite_shoreline_mhw_biscayne.geojson data/spatial/research/noaa_mhhw_screening_line_biscayne.geojson data/spatial/research/noaa-shoreline-comparison-audit.json data/spatial/research/noaa_composite_shoreline_mhw_metadata.json data/spatial/research/noaa_mhhw_screening_line_metadata.json
          if git diff --cached --quiet; then
            echo "No shoreline comparison outputs changed."
            exit 0
          fi
          git commit -m "Persist NOAA Biscayne shoreline comparison geometry"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push race detected; rebasing on latest research branch (attempt \${attempt}/3)."
            git fetch origin "${TARGET_BRANCH}"
            git rebase FETCH_HEAD
          done
          exit 1
      - name: Upload NOAA shoreline service inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-biscayne-shoreline-service-inventory
          path: artifacts/noaa-shoreline/
          if-no-files-found: warn
          retention-days: 14
