name: Diagnose SST ERDDAP access

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Compare NOAA ERDDAP endpoints and request sizes
        run: python scripts/diagnose_sst_sources.py
