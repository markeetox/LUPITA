name: NOAA Pulley Ridge Targeted Source Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and verify targeted source files
        run: python scripts/download_noaa_pulley_ridge_samples.py
      - name: Upload temporary research inputs
        uses: actions/upload-artifact@v4
        with:
          name: noaa-pulley-ridge-source-samples
          path: noaa-pulley-ridge-research/
          if-no-files-found: error
          retention-days: 14
