name: South Florida in-situ temperature audit

on:
  pull_request:
    paths:
      - "scripts/audit_south_florida_temperatures.py"
      - ".github/workflows/south-florida-temperature-audit.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extract-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install requests
      - name: Download logger observations and matching MUR SST
        run: python scripts/audit_south_florida_temperatures.py --output temperature-research-output
      - name: Upload raw extracts and research report
        uses: actions/upload-artifact@v4
        with:
          name: south-florida-temperature-audit
          path: temperature-research-output/
          if-no-files-found: error
          retention-days: 30
