name: NOAA NSDE project download discovery

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/inspect_noaa_nsde_project_ui.py"
      - ".github/workflows/noaa-nsde-project-discovery.yml"

permissions:
  contents: read

concurrency:
  group: noaa-nsde-project-discovery
  cancel-in-progress: true

jobs:
  inspect-project-download-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect NOAA NSDE project filter and network endpoints
        run: python scripts/inspect_noaa_nsde_project_ui.py
      - name: Upload NSDE UI inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-nsde-project-ui-discovery
          path: artifacts/nsde-cmp-ui/
          if-no-files-found: warn
          retention-days: 14
