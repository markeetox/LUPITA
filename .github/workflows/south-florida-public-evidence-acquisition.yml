name: South Florida Public Evidence Acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Syntax-check acquisition script
        run: python -m py_compile scripts/acquire_south_florida_public_evidence.py
      - name: Acquire public source data and exact-name extracts
        run: python scripts/acquire_south_florida_public_evidence.py
      - name: Upload read-only research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: south-florida-public-evidence
          path: south-florida-public-evidence/
          if-no-files-found: warn
          retention-days: 14
