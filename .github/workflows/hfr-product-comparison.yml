name: Compare NOAA HF Radar products

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: Exact common UTC observation time (must exist in all three products)
        required: true
        default: "2026-11-13T04:00:00Z"
        type: string

permissions:
  contents: read

concurrency:
  group: hfr-product-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only diagnostic dependency
        run: python -m pip install "requests>=2.31"
      - name: Compare native HF Radar grids
        env:
          HFR_TIMESTAMP: \${{ inputs.timestamp }}
        run: |
          python scripts/compare_hfr_products.py --time "$HFR_TIMESTAMP" --output-dir artifacts/hfr-comparison
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfr-product-comparison
          path: artifacts/hfr-comparison/
          if-no-files-found: warn
          retention-days: 30
