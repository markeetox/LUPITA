name: NOAA Southern Flounder Survey Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract Southern flounder observations from NOAA DisMAP layers
        run: python scripts/extract_noaa_southern_flounder.py
      - name: Upload temporary research artifact
        uses: actions/upload-artifact@v4
        with:
          name: noaa-southern-flounder-survey-extraction
          path: noaa-southern-flounder-research/
          if-no-files-found: error
          retention-days: 14
