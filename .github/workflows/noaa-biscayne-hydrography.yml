name: NOAA Biscayne Bay hydrography audit

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/extract_noaa_biscayne_hydrography.py"
      - "scripts/extract_south_florida_bridge_inventory.py"
      - "scripts/curate_noaa_named_water_geometries.py"
      - "tests/test_noaa_biscayne_hydrography.py"
      - "tests/test_south_florida_bridge_inventory.py"
      - "tests/test_curate_noaa_named_water_geometries.py"
      - "tests/test_spatial_catalog.py"
      - ".github/workflows/noaa-biscayne-hydrography.yml"

permissions:
  contents: write

concurrency:
  group: noaa-biscayne-hydrography
  cancel-in-progress: false

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install geometry QA dependency
        run: python -m pip install shapely
      - name: Run NOAA and bridge inventory extraction tests
        run: |
          python -m pytest -q \
            tests/test_noaa_biscayne_hydrography.py \
            tests/test_south_florida_bridge_inventory.py \
            tests/test_curate_noaa_named_water_geometries.py
      - name: Extract NOAA Harbour ENC and maintained-channel geometries
        run: python scripts/extract_noaa_biscayne_hydrography.py --output-dir artifacts/noaa-hydrography
      - name: Extract official Miami-Dade and FDOT bridge inventory geometries
        run: python scripts/extract_south_florida_bridge_inventory.py --output-dir artifacts/bridge-inventory
      - name: Curate named-water geometries and run topology precheck
        run: python scripts/curate_noaa_named_water_geometries.py --output-dir data/spatial
      - name: Validate persisted spatial catalog and curated geometries
        env:
          LUPITA_REQUIRE_CURATED_GIS: "1"
        run: python -m pytest -q tests/test_spatial_catalog.py
      - name: Persist curated GIS review data on the research branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The PR branch may receive documentation or catalog edits while extraction runs.
          # Rebase the generated outputs onto the latest branch before persisting them.
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard FETCH_HEAD
          python scripts/curate_noaa_named_water_geometries.py --source artifacts/noaa-hydrography/harbor_named_water_areas.geojson --output-dir data/spatial
          python -m pytest -q tests/test_spatial_catalog.py
          mkdir -p data/spatial/research/noaa_enc data/spatial/research/transportation
          cp artifacts/noaa-hydrography/harbor_causeway_lines.geojson data/spatial/research/noaa_enc/
          cp artifacts/noaa-hydrography/harbor_bridge_lines.geojson data/spatial/research/noaa_enc/
          cp artifacts/noaa-hydrography/harbor_landmark_points.geojson data/spatial/research/noaa_enc/
          cp artifacts/bridge-inventory/miamidade_dtpw_bridge_lines.geojson data/spatial/research/transportation/
          if [ -f artifacts/bridge-inventory/fdot_rci_bridge_lines.geojson ]; then
            cp artifacts/bridge-inventory/fdot_rci_bridge_lines.geojson data/spatial/research/transportation/
          else
            echo "Optional FDOT bridge inventory was unavailable; retaining Miami-Dade inventory and extraction summary."
          fi
          cp artifacts/bridge-inventory/bridge_inventory_summary.json data/spatial/research/transportation/
          git add data/spatial/noaa-biscayne-named-water-areas.geojson data/spatial/noaa-biscayne-named-water-topology-audit.json data/spatial/feature-catalog.json
          git add data/spatial/research/noaa_enc/harbor_causeway_lines.geojson data/spatial/research/noaa_enc/harbor_bridge_lines.geojson data/spatial/research/noaa_enc/harbor_landmark_points.geojson
          git add data/spatial/research/transportation/
          if git diff --cached --quiet; then
            echo "No curated GIS changes to commit."
            exit 0
          fi
          git commit -m "Persist curated Biscayne named-water and bridge geometries"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push race detected; rebasing on latest research branch (attempt ${attempt}/3)."
            git fetch origin "${TARGET_BRANCH}"
            git rebase FETCH_HEAD
          done
          exit 1
      - name: Upload NOAA and bridge inventory review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-biscayne-hydrography-review
          path: |
            artifacts/noaa-hydrography/
            artifacts/bridge-inventory/
          if-no-files-found: warn
          retention-days: 14
