name: NOAA Biscayne Bay hydrography audit

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/extract_noaa_biscayne_hydrography.py"
      - "scripts/curate_noaa_named_water_geometries.py"
      - "tests/test_noaa_biscayne_hydrography.py"
      - "tests/test_curate_noaa_named_water_geometries.py"
      - "tests/test_spatial_catalog.py"
      - ".github/workflows/noaa-biscayne-hydrography.yml"

permissions:
  contents: write

concurrency:
  group: noaa-biscayne-hydrography
  cancel-in-progress: true

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install geometry QA dependency
        run: python -m pip install shapely
      - name: Run NOAA hydrography tests
        run: python -m pytest -q tests/test_noaa_biscayne_hydrography.py tests/test_curate_noaa_named_water_geometries.py
      - name: Extract NOAA Harbour ENC and maintained-channel geometries
        run: python scripts/extract_noaa_biscayne_hydrography.py --output-dir artifacts/noaa-hydrography
      - name: Curate named-water geometries and run topology precheck
        run: python scripts/curate_noaa_named_water_geometries.py --output-dir data/spatial
      - name: Validate persisted spatial catalog and curated geometries
        run: python -m pytest -q tests/test_spatial_catalog.py
      - name: Persist curated GIS review data on the research branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The PR branch may receive documentation or catalog edits while extraction runs.
          # Rebase the generated outputs onto the latest branch before persisting them.
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard FETCH_HEAD
          python scripts/curate_noaa_named_water_geometries.py --source artifacts/noaa-hydrography/harbor_named_water_areas.geojson --output-dir data/spatial
          python -m pytest -q tests/test_spatial_catalog.py
          git add data/spatial/noaa-biscayne-named-water-areas.geojson data/spatial/noaa-biscayne-named-water-topology-audit.json data/spatial/feature-catalog.json
          if git diff --cached --quiet; then
            echo "No curated GIS changes to commit."
            exit 0
          fi
          git commit -m "Persist curated Biscayne named-water geometries"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Upload NOAA hydrography review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-biscayne-hydrography-review
          path: artifacts/noaa-hydrography/
          if-no-files-found: warn
          retention-days: 14
