name: Copernicus bottom-temperature metadata inspection

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: copernicus-bottom-temperature-metadata
  cancel-in-progress: true

jobs:
  inspect-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copernicus Marine Toolbox
        run: python -m pip install --disable-pip-version-check "copernicusmarine==2.4.0"

      - name: Retrieve dataset metadata
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::error::Copernicus Marine repository secrets are missing or empty."
            exit 1
          fi
          mkdir -p artifacts/copernicus-metadata
          copernicusmarine describe --dataset-id cmems_mod_glo_phy_anfc_0.083deg_P1D-m --return-fields all > artifacts/copernicus-metadata/forecast-daily.json
          copernicusmarine describe --dataset-id cmems_mod_glo_phy_my_0.083deg_P1D-m --return-fields all > artifacts/copernicus-metadata/reanalysis-daily.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("artifacts/copernicus-metadata").glob("*.json")):
              data = json.loads(path.read_text())
              print(f"{path.name}: valid JSON, {path.stat().st_size} bytes")
              products = data.get("products", [])
              print(f"  products={len(products)}")
          PY

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-bottom-temperature-metadata
          path: artifacts/copernicus-metadata/*.json
          if-no-files-found: error
          retention-days: 7
