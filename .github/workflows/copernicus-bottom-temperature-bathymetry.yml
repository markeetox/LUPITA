name: Copernicus bottom-temperature bathymetry assessment

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Enter the numeric run ID from the NEW successful pilot containing the latest candidate sampling boxes"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source pilot run ID
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be the numeric GitHub Actions run ID from the successful Copernicus pilot. Example: 44160953510"
            exit 1
          fi

      - name: Download the existing read-only pilot artifact
        uses: actions/download-artifact@v4
        with:
          name: copernicus-bottom-temperature-pilot
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/source-pilot

      - name: Install assessment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests xarray netCDF4

      - name: Classify land, ocean, and depth classes
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python scripts/assess_copernicus_bottom_temperature_bathymetry.py

      - name: Upload bathymetry assessment
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-bottom-temperature-bathymetry-assessment
          path: artifacts/copernicus-bottom-temperature-bathymetry/
          if-no-files-found: error
          retention-days: 14
