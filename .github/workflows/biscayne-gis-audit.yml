name: Biscayne Bay GIS geometry audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: biscayne-gis-audit
  cancel-in-progress: false

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install research geometry dependencies
        run: python -m pip install shapely pyproj
      - name: Run extraction and candidate-builder tests
        run: python -m pytest -q tests/test_biscayne_gis_extraction.py tests/test_biscayne_subregion_candidates.py
      - name: Extract FWC source and benthic geometries
        run: python scripts/extract_biscayne_bay_gis.py --output-dir artifacts/biscayne-gis
      - name: Rebase generated outputs onto latest research branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard FETCH_HEAD
      - name: Build ecological subregion and habitat candidates
        run: |
          python scripts/build_biscayne_subregion_candidates.py \
            --benthic artifacts/biscayne-gis/unified_benthic_polygons.geojson \
            --footprints artifacts/biscayne-gis/source_footprints.geojson \
            --preserves data/spatial/research/noaa_cmp/overlay/fdep_biscayne_aquatic_preserves.geojson \
            --named-water data/spatial/noaa-biscayne-named-water-areas.geojson \
            --output-dir data/spatial
      - name: Validate generated candidate outputs
        run: python -m pytest -q tests/test_biscayne_subregion_candidates.py tests/test_spatial_catalog.py
      - name: Persist research-only candidate outputs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spatial/biscayne-subregion-habitat-audit.json data/spatial/biscayne-tidal-flat-patches.geojson
          if git diff --cached --quiet; then
            echo "No candidate output changes."
            exit 0
          fi
          git commit -m "Persist Biscayne subregion habitat candidates"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            git fetch origin "${TARGET_BRANCH}"
            git rebase FETCH_HEAD
          done
          exit 1
      - name: Upload GIS review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biscayne-bay-gis-review
          path: |
            artifacts/biscayne-gis/
            data/spatial/biscayne-subregion-habitat-audit.json
            data/spatial/biscayne-tidal-flat-patches.geojson
          if-no-files-found: warn
          retention-days: 14
