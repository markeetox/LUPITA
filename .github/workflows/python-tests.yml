name: Python tests

on:
  pull_request:
    paths:
      - "**.py"
      - "data/species/**"
      - "data/parameters.json"
      - "requirements.txt"
      - "web/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "data/species/**"
      - "data/parameters.json"
      - "requirements.txt"
      - "web/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check map client JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts or not scripts[-1].strip():
              raise SystemExit("No inline map client script found")
          Path("/tmp/lupita-map-client.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/lupita-map-client.js
          node --check web/lupita-data-adapter.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install research geometry dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Generate species profile audit
        run: python scripts/validate_species.py --output-dir reports
      - uses: actions/upload-artifact@v4
        with:
          name: lupita-species-audit
          path: reports/species-audit.*
