name: WOD GLD South Florida ETOPO join (manual research)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research parser and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-wod.txt pytest
      - name: Verify pinned parser import
        run: python -c "from wodpy.wod import WodProfile; print('IQuOD WodProfile import OK')"
      - name: Run ETOPO join unit tests
        run: python -m pytest -q tests/test_join_wod_gld_etopo.py
      - name: Report validation scope
        run: |
          echo "Pinned parser import and grid-join tests passed."
          echo "The actual NOAA GLD archive and ETOPO artifact must be supplied locally to run the full join."
