name: Copernicus Marine credentials check

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: copernicus-marine-credentials-check
  cancel-in-progress: true

jobs:
  credentials-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copernicus Marine Toolbox
        run: python -m pip install --disable-pip-version-check "copernicusmarine==2.4.0"

      - name: Verify Copernicus Marine credentials
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::error::One or both Copernicus Marine repository secrets are missing or empty."
            exit 1
          fi
          copernicusmarine --version
          copernicusmarine login --check-credentials-valid
          echo "Copernicus Marine credentials validated successfully."
