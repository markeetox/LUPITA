name: Pull ocean data

on:
  schedule:
    - cron: "10 * * * *"   # every hour, at 10 minutes past (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs overlap (a manual run plus the hourly one, for example).
concurrency:
  group: pull-ocean-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # Full regional data refresh plus tests and data-branch publication can exceed 25 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The last published data, so a failed run never wipes out good predictions.
      - uses: actions/checkout@v4
        continue-on-error: true      # the data branch does not exist on a very first run
        with:
          ref: data
          path: previous
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.catalog
      - run: python -m pipeline.run
      # Publishes to a "data" branch, so Vercel does not redeploy on every pull and Seabound can fetch the JSON from there.
      - run: |
          mkdir -p publish
          if [ -f data/live/species_catalog.json ]; then cp data/live/species_catalog.json publish/; fi
          cp data/live/*.json publish/ || true
          cp data/parameters.json publish/
          cp -r data/species publish/species
          # The app-facing API (api/v1/...) written by the pipeline.
          if [ -d data/live/api ]; then cp -r data/live/api publish/api; fi
          # Per-species heatmap JSON files
          if [ -d data/live/heat ]; then cp -r data/live/heat publish/heat; fi
          # Keep the last good copy of anything this run did not produce (for example when NOAA refused a request).
          if [ -d previous ]; then
            for f in previous/*.json; do
              [ -e "publish/$(basename "$f")" ] || cp "$f" publish/
            done
            if [ ! -d publish/api ] && [ -d previous/api ]; then cp -r previous/api publish/api; fi
            if [ ! -d publish/heat ] && [ -d previous/heat ]; then cp -r previous/heat publish/heat; fi
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: data
          force_orphan: true

      # Publish diagnostics first, then fail the run if critical data could not refresh.
      - name: Evaluate published refresh health
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          latest_path = Path("publish/latest.json")
          if not latest_path.exists():
              print("::error::Refresh diagnostics are missing; refusing to report success.")
              sys.exit(1)

          latest = json.loads(latest_path.read_text())
          health = latest.get("pipeline_health", {})
          status = health.get("status", "unknown")
          critical = health.get("critical_issues", [])
          optional = health.get("optional_layer_issues", [])
          errors = latest.get("errors", [])

          lines = [f"## Pull Ocean Data health: {status.upper()}",
                   f"- Predictions refreshed: {health.get('prediction_refreshed', False)}",
                   f"- Critical issues: {len(critical)}",
                   f"- Optional layer issues: {len(optional)}",
                   f"- Recorded errors: {len(errors)}"]
          lines.extend(f"- **Critical:** {item}" for item in critical)
          lines.extend(f"- **Layer:** {item}" for item in optional)
          lines.extend(f"- **Error:** {item}" for item in errors)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")

          if status == "failed":
              print("::error::Critical refresh failure. Diagnostics and last-known-good outputs were published.")
              sys.exit(1)
          if status == "degraded":
              print("::warning::Refresh completed with optional data-source issues. Review the job summary.")
          elif status == "healthy":
              print("Refresh health: healthy.")
          else:
              print(f"::error::Unknown refresh health status: {status}")
              sys.exit(1)
          PY
